services:
  checker:
    build:
      context: .
      dockerfile: docker/Dockerfile

    image: do-checker-ent:2.1.0
    container_name: do-checker-ent

    env_file:
      - .env

    # The list of names allowed through to the container, so that any of them can
    # be set for a single run from the shell:
    #   GUNICORN_WORKERS=1 docker compose up -d --force-recreate
    #
    # Bare names, never `NAME=${NAME:-default}`. A default here would be put in
    # the container's environment on every run, and the environment overrides
    # app.yaml - so `session_scope: geo` in the file would be ignored in favour
    # of a default nobody asked for. Unset means the variable does not reach the
    # container at all, leaving app.yaml (or the application's own default) to
    # decide. Values in .env still apply: compose reads it both as env_file and
    # for ${...} substitution.
    environment:
      - GUNICORN_WORKERS
      - GUNICORN_TIMEOUT
      - GUNICORN_GRACEFUL_TIMEOUT
      - GUNICORN_RELOAD
      - SOAX_SESSION_SCOPE
      - DNS_USE_IPV6
      - ALIVE_CHECK_ENABLED
      - ALIVE_CHECK_TARGETS
      - ALIVE_CHECK_REQUIRED_OK
      - ALIVE_CHECK_TIMEOUT_SEC
      - SOAX_PACKAGE_PASSWORD

    ports:
      - "${APP_HOST:-127.0.0.1}:${APP_PORT:-8888}:${APP_PORT:-8888}"

    volumes:
      - ./data:/data
      - ./logs:/logs
      - .:/app

    command: gunicorn -c docker/gunicorn.conf.py server:app
